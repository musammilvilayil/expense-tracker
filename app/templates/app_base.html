<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}AI Finance Tracker{% endblock %}</title>
<meta name="csrf-token" content="{{ csrf_token() }}">
<script src="/static/csrf.js"></script>
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="/static/style.css"></head>
<body class="app">
<div class="progress" aria-hidden="true"><i></i></div>
<header class="apptop"><a class="brand" href="/"><i></i>AI Finance Tracker</a>
  <div><a href="/dashboard">Dashboard</a><a href="/settings">Settings</a>{% if is_admin %}<a href="/admin">Admin</a>{% endif %}
    <span>{{ username }}</span> <button id="logout" class="secondary">Sign out</button></div></header>
<main class="appmain">{% block content %}{% endblock %}</main>
<script src="/static/common.js"></script>
<script src="/static/site.js" defer></script>
{% block scripts %}{% endblock %}
</body></html>
