{% extends "public_base.html" %}
{% from "_art.html" import shield %}
{% block title %}Choose a new password · AI Finance Tracker{% endblock %}
{% block content %}
<div class="pagehead"><div class="wrap"><div><span class="eyebrow pill">Account</span><h1>Choose a new password</h1></div><div aria-hidden="true">{{ shield() }}</div></div></div>
<div class="wrap"><div class="content">
<form id="f" class="card cform"><label>New password (8+ characters) <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
  <button>Set password</button><p id="msg" role="status"></p></form>
</div></div>
<script>
document.getElementById('f').addEventListener('submit', async e => { e.preventDefault();
  const r = await fetch('/api/reset', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token: {{ token|tojson }}, password: e.target.password.value})});
  const j = await r.json(); const m = document.getElementById('msg');
  if (r.ok) { m.textContent = 'Password updated. Redirecting to sign in…'; setTimeout(() => location.href = '/login', 1200); } else m.textContent = j.error; });
</script>
{% endblock %}
