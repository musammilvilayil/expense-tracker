{% extends "public_base.html" %}
{% block title %}Contact · AI Finance Tracker{% endblock %}
{% block content %}
<h1>Contact us</h1>
{% if sent %}<p class="card" role="status">Thanks! Your message has been received.</p>{% endif %}
{% if errors %}<div class="alert" role="alert"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" class="card cform" novalidate>
  <label>Name <input name="name" value="{{ form.get('name','') }}" maxlength="80" required></label>
  <label>Email <input name="email" type="email" value="{{ form.get('email','') }}" maxlength="120" required></label>
  <label>Subject <input name="subject" value="{{ form.get('subject','') }}" maxlength="120" required></label>
  <label>Message <textarea name="message" rows="6" maxlength="2000" required>{{ form.get('message','') }}</textarea></label>
  <div class="hp" aria-hidden="true"><label>Leave blank <input name="website" tabindex="-1" autocomplete="off"></label></div>
  <button type="submit">Send message</button>
</form>
{% endblock %}
